<app-auth-layout title="Login to Stream ION" subtitle="Welcome back">
  <form class="login__form" (ngSubmit)="onLogin()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        autocomplete="email"
        placeholder="Enter your email"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        autocomplete="current-password"
        placeholder="Enter password"
      />
    </mat-form-field>

    <appcore-button
      class="login__submit"
      label="Login"
      type="primary"
      size="medium"
      nativeType="submit"
    ></appcore-button>
  </form>

  <p class="login__switch">
    Don't have an account? <a routerLink="/signup">Sign Up</a>
  </p>
</app-auth-layout>
